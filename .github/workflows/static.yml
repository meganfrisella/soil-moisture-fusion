# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Prepare maps
        run: |
          mkdir -p "$RUNNER_TEMP/station-map"
          cp outputs/station_map.html "$RUNNER_TEMP/station-map/index.html"
          for region in gaia_domain eastern_washington; do
            mkdir -p "$RUNNER_TEMP/station-map/$region"
            cp "outputs/$region/$region.html" "$RUNNER_TEMP/station-map/$region/index.html"
            cp -R "outputs/$region/${region}_assets" "$RUNNER_TEMP/station-map/$region/"
          done
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/station-map
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
